<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Advisory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #000;
      --fg: #ededed;
      --mut: #8c8c8c;
      --dim: #5c5c5c;
      --line: #222;
      --danger: #ff5252;
      --caution: #ff9800;
      --advisory: #ffc107;
      --info: #64b5f6;
      --none: #6b6b6b;
      --font: 'Inter', system-ui, sans-serif;
    }

    html,
    body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font: 15px/1.65 var(--font);
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 16px 24px;
      font-size: 13px;
      color: var(--mut);
    }

    header b {
      color: var(--fg);
      font-weight: 500;
    }

    #ctx {
      opacity: 0;
      transition: opacity .3s;
      text-align: right;
    }

    #ctx.on {
      opacity: 1;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 0 16px 24px;
    }

    #col {
      max-width: 720px;
      margin: 0 auto;
      width: 100%;
    }

    #chat.empty #col {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #hint {
      color: var(--dim);
      font-size: 14px;
      text-align: center;
      max-width: 360px;
    }

    .msg {
      margin: 24px 0;
    }

    .msg.user {
      display: flex;
      justify-content: flex-end;
    }

    .msg.user .bubble {
      background: #141414;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 9px 16px;
      max-width: 80%;
    }

    .msg.bot {
      --c: var(--none);
      border-left: 2px solid var(--c);
      padding-left: 16px;
    }

    .sev-danger {
      --c: var(--danger);
    }

    .sev-caution {
      --c: var(--caution);
    }

    .sev-advisory {
      --c: var(--advisory);
    }

    .sev-info {
      --c: var(--info);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 500;
      color: var(--c);
      margin-bottom: 6px;
    }

    .badge::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--c);
    }

    .meta {
      font-size: 12px;
      color: var(--dim);
      margin-top: 10px;
    }

    .meta code {
      color: var(--mut);
      font-family: ui-monospace, Menlo, Consolas, monospace;
    }

    .err-line {
      color: var(--mut);
      font-size: 14px;
      margin-top: 4px;
    }

    details {
      margin-top: 14px;
    }

    summary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      list-style: none;
      width: fit-content;
      color: var(--mut);
      font-size: 13px;
      font-weight: 500;
      padding: 7px 14px;
      border: 1px solid #2f2f2f;
      border-radius: 999px;
      transition: .15s;
    }

    summary::-webkit-details-marker {
      display: none;
    }

    summary::before {
      content: "▸";
      font-size: 14px;
    }

    details[open] summary::before {
      content: "▾";
    }

    summary:hover {
      color: var(--fg);
      border-color: #555;
      background: #111;
    }

    .ic {
      font-size: 17px;
      line-height: 1;
    }

    .lbl-open {
      display: none;
    }

    details[open] .lbl-open {
      display: inline;
    }

    details[open] .lbl-closed {
      display: none;
    }

    pre {
      margin-top: 8px;
      padding-left: 12px;
      border-left: 1px solid var(--line);
      color: var(--mut);
      font: 11.5px/1.7 ui-monospace, Menlo, Consolas, monospace;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .typing {
      display: flex;
      gap: 4px;
      padding: 8px 0;
    }

    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--dim);
      animation: b 1.2s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: .2s;
    }

    .typing span:nth-child(3) {
      animation-delay: .4s;
    }

    @keyframes b {

      0%,
      80%,
      100% {
        opacity: .3;
      }

      40% {
        opacity: 1;
      }
    }

    #bar {
      padding: 8px 16px calc(16px + env(safe-area-inset-bottom));
      background: linear-gradient(transparent, #000 35%);
    }

    .box {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      border: 1px solid #2a2a2a;
      border-radius: 24px;
      padding: 8px 8px 8px 20px;
      background: #0a0a0a;
    }

    .box:focus-within {
      border-color: #505050;
    }

    textarea {
      flex: 1;
      background: none;
      border: 0;
      outline: 0;
      color: var(--fg);
      font: inherit;
      resize: none;
      max-height: 140px;
      padding: 6px 0;
    }

    textarea::placeholder {
      color: rgba(255, 255, 255, .32);
    }

    #send-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid #333;
      background: transparent;
      color: #555;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: .15s;
      flex-shrink: 0;
    }

    #send-btn.ready {
      background: var(--fg);
      color: #000;
      border-color: var(--fg);
    }

    #send-btn:disabled {
      cursor: not-allowed;
    }

    #send-btn:focus-visible,
    summary:focus-visible {
      outline: 2px solid #777;
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      .typing span {
        animation: none;
      }

      * {
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <header>
    <b>Weather Advisory</b>
    <span id="ctx"></span>
  </header>

  <div id="chat" class="empty">
    <div id="col">
      <p id="hint">Answers come only from written safety policies and live forecast data.</p>
    </div>
  </div>

  <div id="bar">
    <div class="box">
      <textarea id="msg-input" rows="1" aria-label="Ask about an outdoor activity"></textarea>
      <button id="send-btn" aria-label="Send" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 19V5M5 12l7-7 7 7" />
        </svg>
      </button>
    </div>
  </div>

  <script>
    const SESSION_ID = crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2);
    const API_BASE = window.location.origin;
    const $ = id => document.getElementById(id);
    const chat = $('chat'), col = $('col'), input = $('msg-input'), sendBtn = $('send-btn');

    // Translucent example in the input; disappears as soon as the user types.
    const EXAMPLES = [
      'Is it safe to cycle in Bhopal this evening?',
      'Can I take my kid to the park in Pune tomorrow?',
      'Is today good for a picnic in Delhi?',
      'Should I go for a run in Mumbai tonight?'
    ];
    let ex = 0;
    input.placeholder = EXAMPLES[0];
    setInterval(() => { if (!input.value) { ex = (ex + 1) % EXAMPLES.length; input.placeholder = EXAMPLES[ex]; } }, 4500);

    const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br/>');
    const sevClass = s => ['danger', 'caution', 'advisory', 'info'].includes(s) ? 'sev-' + s : '';

    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = input.scrollHeight + 'px';
      sendBtn.classList.toggle('ready', !!input.value.trim());
      sendBtn.disabled = !input.value.trim();
    });
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendMessage(); }
    });
    sendBtn.addEventListener('click', sendMessage);

    function addMsg(role, html, cls = '') {
      chat.classList.remove('empty');
      const h = $('hint'); if (h) h.remove();
      const wrap = document.createElement('div');
      wrap.className = `msg ${role} ${cls}`;
      wrap.innerHTML = role === 'user' ? `<div class="bubble">${html}</div>` : html;
      col.appendChild(wrap);
      chat.scrollTop = chat.scrollHeight;
      return wrap;
    }

    function showTyping() {
      const w = addMsg('bot', '<div class="typing"><span></span><span></span><span></span></div>');
      w.id = 'typing';
    }
    const hideTyping = () => { const t = $('typing'); if (t) t.remove(); };

    function updateContext(d) {
      const el = $('ctx');
      const text = [d.location, d.activity, d.time_window].filter(Boolean).join(' · ');
      el.textContent = text;
      el.classList.toggle('on', !!text);
    }

    const HIDDEN = ['resolved_location', 'latitude', 'longitude', 'time_window_label', 'fetched_at', 'turn_id', 'weather_codes'];

    function forecastBlock(d) {
      const snap = d.weather_snapshot;
      if (!snap || snap.turn_id !== d.turn_id) return '';           // never show a forecast from another turn
      const keys = Object.keys(snap).filter(k => !HIDDEN.includes(k));
      if (!keys.length) return '';
      const head = `Location: ${snap.resolved_location || 'Unknown'}\nLat/Lon: ${snap.latitude}, ${snap.longitude}\nTime: ${snap.time_window_label}\nFetched: ${snap.fetched_at}\n\n`;
      let varsHtml = `<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0 16px;">`;
      keys.forEach(k => {
        const v = snap[k];
        varsHtml += `<div>${esc(k)}: ${esc(Array.isArray(v) ? v.join(', ') : (v === null ? 'n/a' : v))}</div>`;
      });
      varsHtml += `</div>`;
      return `<details open><summary><span class="ic">🌡</span><span class="lbl-closed">Forecast data used</span><span class="lbl-open">Hide forecast data</span></summary><div style="margin-top: 8px; padding-left: 12px; border-left: 1px solid var(--line); color: var(--mut); font: 11.5px/1.7 ui-monospace, monospace; white-space: pre-wrap; word-break: break-word;">${esc(head)}${varsHtml}</div></details>`;
    }

    // Renders a coded error object if the backend sends one: {code, meaning, what_happened, what_to_do, reference_id, technical}
    function errorBlock(d) {
      const e = d.error;
      let h = `<div class="badge">${esc(d.badge_label || 'No guidance')}</div>`;
      h += `<div><b>${esc(e.meaning)}</b> (${esc(e.code)})</div>`;
      if (e.what_happened) h += `<div class="err-line">What happened: ${esc(e.what_happened)}</div>`;
      if (e.what_to_do) h += `<div class="err-line">What you can do: ${esc(e.what_to_do)}</div>`;
      if (e.reference_id) h += `<div class="meta">Reference <code>${esc(e.reference_id)}</code></div>`;
      if (e.technical) h += `<details><summary>Technical details</summary><pre>${esc(typeof e.technical === 'string' ? e.technical : JSON.stringify(e.technical, null, 2))}</pre></details>`;
      return h;
    }

    function buildBot(d) {
      if (d.error) return { html: errorBlock(d), cls: '' };
      let html = '';
      if (d.badge_label) html += `<div class="badge">${esc(d.badge_label)}</div>`;
      html += `<div>${esc(d.reply)}</div>`;
      if (d.primary_sop) {
        const also = (d.also_applies || []).map(x => `<code>${esc(typeof x === 'string' ? x : (x.sop_id || x.id))}</code>`);
        html += `<div class="meta">Based on <code>${esc(d.primary_sop)}</code>${also.length ? ' · Also applies ' + also.join(', ') : ''}</div>`;
      }
      html += forecastBlock(d);
      return { html, cls: sevClass(d.severity) };
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text || sendBtn.disabled && !text) return;
      addMsg('user', esc(text));
      input.value = ''; input.style.height = 'auto';
      sendBtn.classList.remove('ready'); sendBtn.disabled = true;
      showTyping();
      try {
        const res = await fetch(`${API_BASE}/chat`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, session_id: SESSION_ID })
        });
        hideTyping();
        if (!res.ok) {
          const msg = res.status >= 500
            ? `Server error (HTTP ${res.status}). The backend hit a problem; check the server log.`
            : `Unexpected response (HTTP ${res.status}).`;
          addMsg('bot', `<div class="err-line">${esc(msg)}</div>`);
          return;
        }
        const data = await res.json();
        const { html, cls } = buildBot(data);
        addMsg('bot', html, cls);
        updateContext(data);
      } catch (err) {
        hideTyping();
        const msg = err instanceof TypeError
          ? 'Cannot connect to the server. Is start.bat running?'
          : `Server error: ${err.message}`;
        addMsg('bot', `<div class="err-line">${esc(msg)}</div>`);
      } finally {
        input.focus();
      }
    }
  </script>
</body>

</html>
